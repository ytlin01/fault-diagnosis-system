      - "是否拋轉PMS"
      - "Root Cause"
      - "ST Action"
      - "Repair Action"
      - "設備現有Error Code"
      - "廠區"
      - "機種"
      - "製程"
      - "設備類型 Consign/HC"
      - "工站名稱"
      - "廠商 Vendor"
    name_mapping:
      content_columns:
        - "Error Description"
        - "Error Description (Chinese)"
        - "Root Cause"
        - "ST Action"
        - "Repair Action"
    governance:
      dedupe:
        enabled: true
    column_aliases:
      "Error Code":
        - "Error code"
        - "ErrorCode"
      "Error Description (Chinese)":
